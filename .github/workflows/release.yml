name: Release

# Publishes a new version that installed apps pick up as an update.
# Bump `version:` in pubspec.yaml (and AppConstants.appVersion), push to main,
# and this builds macOS + Windows and publishes the GitHub Release v<version>.
# Pushes that keep the same version do nothing. Can also be started manually:
# Actions → "Release" → Run workflow.
on:
  push:
    branches: [main]
    paths: [pubspec.yaml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          v="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml)"
          if ! grep -q "appVersion = '$v'" lib/core/constants/app_constants.dart; then
            echo "::error::AppConstants.appVersion does not match pubspec.yaml ($v)"
            exit 1
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: Skip versions that are already published
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.value }}
        run: |
          draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null || echo none)"
          if [ "$draft" = "false" ]; then
            echo "$TAG is already published; nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  macos:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    uses: ./.github/workflows/build-macos.yml
    with:
      run_tests: true
    secrets: inherit

  windows:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    uses: ./.github/workflows/build-windows.yml
    with:
      run_tests: false
    secrets: inherit

  publish:
    needs: [prepare, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Vesper-*
          merge-multiple: true
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.prepare.outputs.version }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ls -la dist
          # An old draft with this tag (from a manual build) is replaced.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Vesper $VERSION" \
            --generate-notes \
            --latest
